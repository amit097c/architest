name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to ACR
      uses: docker/login-action@v2
      with:
        registry: teamxceedacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push images
      run: |
        docker compose -f docker-compose.prod.yml build
        docker compose -f docker-compose.prod.yml push

    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

    - name: Deploy to Azure Web App for Containers
      run: |
        # Login with publish profile
        publishProfileContent="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
        
        # Extract credentials from publish profile XML
        xmlString="$publishProfileContent"
        userName=$(echo "$xmlString" | grep -oP '(?<=userName=")[^"]*' | head -1)
        userPWD=$(echo "$xmlString" | grep -oP '(?<=userPWD=")[^"]*' | head -1)
        
        # Login with publish profile credentials
        az login --service-principal \
          --username "$userName" \
          --password "$userPWD" \
          --tenant $(echo "$userName" | cut -d '@' -f 2)
        
        # Deploy with docker-compose
        az webapp config container set \
          --name teamxceed-app \
          --resource-group TeamXceed \
          --multicontainer-config-type compose \
          --multicontainer-config-file docker-compose.prod.yml \
          --docker-registry-server-url https://teamxceedacr.azurecr.io \
          --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
          --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
