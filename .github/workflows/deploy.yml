name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to ACR
      run: |
        echo ${{ secrets.ACR_PASSWORD }} | docker login teamxceedacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Build and push images
      run: |
        docker-compose -f docker-compose.prod.yml build
        docker-compose -f docker-compose.prod.yml push

    - name: Deploy to App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: teamxceed-app
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: |
          teamxceedacr.azurecr.io/architest/frontend:latest
          teamxceedacr.azurecr.io/architest/backend:latest
          teamxceedacr.azurecr.io/architest/llm:latest
