name: Deploy to Azure App Service for Containers

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Verify Docker Compose version
      run: |
        docker --version
        docker compose version
        echo "Using Docker Compose V2 format (without hyphen)"

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Verify Azure login
      run: |
        az account show --query name -o tsv
        echo "Successfully logged into Azure"

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: teamxceedacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push container images
      run: |
        # Build and push the images to ACR
        docker compose -f docker-compose.prod.yml build
        docker compose -f docker-compose.prod.yml push

    - name: Deploy to Azure App Service for Containers
      uses: azure/CLI@v1
      with:
        inlineScript: |
          # Deploy multi-container app using docker-compose.prod.yml
          az webapp config container set \
            --resource-group TeamXceed \
            --name teamxceed-app \
            --multicontainer-config-type compose \
            --multicontainer-config-file docker-compose.prod.yml \
            --docker-registry-server-url https://teamxceedacr.azurecr.io \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
          
          # Restart the app to apply changes
          az webapp restart --name teamxceed-app --resource-group TeamXceed
          
          # Verify deployment
          echo "App Service configuration:"
          az webapp config container show --name teamxceed-app --resource-group TeamXceed
