name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Define all non-sensitive environment variables directly in the workflow
env:
  REGISTRY: teamxceedacr.azurecr.io
  RESOURCE_GROUP: TeamXceed
  FRONTEND_APP_NAME: architest-frontend
  BACKEND_APP_NAME: architest-backend
  LLM_APP_NAME: architest-llm
  OPENAI_API_KEY_SECRET_REF: openai-api-key
  # Service URLs
  BACKEND_URL: https://architest-backend.gentlehill-f0a0de75.canadacentral.azurecontainerapps.io
  FRONTEND_URL: https://architest-frontend.gentlehill-f0a0de75.canadacentral.azurecontainerapps.io
  LLM_URL: https://architest-llm.gentlehill-f0a0de75.canadacentral.azurecontainerapps.io
  # OpenAI settings (non-sensitive defaults)
  OPENAI_API_MODEL: gpt-4
  OPENAI_API_VERSION: 2025-01-01-preview
  AZURE_OPENAI_ENDPOINT: https://architest-openai.openai.azure.com/
  COSMOS_DB_URI_SECRET_REF: cosmosdb-uri
  # OPENAI_API_DEPLOYMENT is only needed if using Azure OpenAI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/architest/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/architest/frontend:latest
          build-args: |
            VITE_BACKEND_URL=${{ env.BACKEND_URL }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/architest/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/architest/backend:latest

      - name: Build and push LLM image
        uses: docker/build-push-action@v4
        with:
          context: ./llm
          push: true
          tags: |
            ${{ env.REGISTRY }}/architest/llm:${{ github.sha }}
            ${{ env.REGISTRY }}/architest/llm:latest

      - name: Deploy Frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/architest/frontend:${{ github.sha }}
          targetPort: 80
          ingress: external
          environmentVariables: "NODE_ENV=production BACKEND_URL=${{ env.BACKEND_URL }} LLM_URL=${{ env.LLM_URL }}"

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/architest/backend:${{ github.sha }}
          targetPort: 8001
          ingress: external
          environmentVariables: "PYTHONUNBUFFERED=1 ENV=production LLM_URL=${{ env.LLM_URL }} BACKEND_URL=${{ env.BACKEND_URL }} FRONTEND_URL=${{ env.FRONTEND_URL }} MONGODB_URI=secretref:${{ env.COSMOS_DB_URI_SECRET_REF }}"

      - name: Deploy LLM to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.LLM_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/architest/llm:${{ github.sha }}
          targetPort: 8000
          ingress: external
          environmentVariables: "PYTHONUNBUFFERED=1 ENV=production LLM_URL=${{ env.LLM_URL }} BACKEND_URL=${{ env.BACKEND_URL }} FRONTEND_URL=${{ env.FRONTEND_URL }} OPENAI_API_KEY=secretref:${{ env.OPENAI_API_KEY_SECRET_REF }} OPENAI_API_MODEL=${{ env.OPENAI_API_MODEL }} OPENAI_API_DEPLOYMENT=${{ secrets.OPENAI_API_DEPLOYMENT }} OPENAI_API_VERSION=${{ env.OPENAI_API_VERSION }} AZURE_OPENAI_ENDPOINT=${{ env.AZURE_OPENAI_ENDPOINT }}"
