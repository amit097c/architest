name: Generate Tests

on:
  push:
    branches:
      - development

jobs:
  generate-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p generated_tests
    
    - name: Make scripts executable
      run: |
        chmod +x cli/cli.py
        chmod +x cli/ci_generate_tests.sh
    
    - name: Start LLM Server
      env:
        OPENAI_API_DEPLOYMENT: ${{ secrets.OPENAI_API_DEPLOYMENT }}
        OPENAI_API_MODEL: ${{ secrets.OPENAI_API_MODEL }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd llm
        # Start the server with output to a log file
        python -m uvicorn server:app --host 0.0.0.0 --port 8000 --log-level debug > llm_server.log 2>&1 &
        LLM_PID=$!
        echo "LLM server started with PID: $LLM_PID"
        cd ..
        # Verify server is up
        sleep 15
        curl -s http://localhost:8000/ || echo "Warning: LLM server not responding"
    
    - name: Start Backend Server
      run: |
        cd Backend
        python -m uvicorn backend:app --host 0.0.0.0 --port 8001 > backend_server.log 2>&1 &
        BACKEND_PID=$!
        echo "Backend server started with PID: $BACKEND_PID"
        cd ..
        # Verify server is up
        sleep 10
        curl -s http://localhost:8001/ || echo "Warning: Backend server not responding"
    
    - name: Check Server Status
      run: |
        echo "Checking LLM server status:"
        curl -s http://localhost:8000/ || echo "LLM server not responding"
        echo "Checking Backend server status:"
        curl -s http://localhost:8001/ || echo "Backend server not responding"
        # List running processes
        echo "Running processes:"
        ps aux | grep -E 'uvicorn|python'
        # Check if ports are in use
        echo "Ports in use:"
        netstat -tuln | grep -E '8000|8001' || echo "No ports found"
    
    - name: Generate tests
      run: |
        ./cli/ci_generate_tests.sh --url https://apple.com/ca/ --steps example_test_steps.txt --output-dir generated_tests --test-name apple
    
    - name: Display LLM Server Logs
      if: always()
      run: |
        echo "==== LLM Server Logs ===="
        cat llm/llm_server.log || echo "Could not find LLM server log"
        
    - name: Display Backend Server Logs
      if: always()
      run: |
        echo "==== Backend Server Logs ===="
        cat Backend/backend_server.log || echo "Could not find Backend server log"
    
    - name: Commit generated tests
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add generated_tests/
        git commit -m "Auto-generate tests for Apple Canada website" || echo "No changes to commit"
        git push 