version: '3.8'

services:
  # Frontend service (production only)
  frontend:
    image: teamxceedacr.azurecr.io/architest/frontend:latest
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8001}
      - LLM_URL=http://llm:${LLM_PORT:-8000}
    depends_on:
      - backend

  # Backend service
  backend:
    image: teamxceedacr.azurecr.io/architest/backend:latest
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - LLM_URL=http://llm:${LLM_PORT:-8000}
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8001}
      - FRONTEND_URL=http://frontend:80
      - PYTHONPATH=/app
    depends_on:
      - llm

  # LLM service
  llm:
    image: teamxceedacr.azurecr.io/architest/llm:latest
    ports:
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - ./llm/chroma_db:/app/chroma_db
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - LLM_URL=http://llm:${LLM_PORT:-8000}
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8001}
      - FRONTEND_URL=http://frontend:80
      - PYTHONPATH=/app
 